<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cinemart</title>

    <link rel="stylesheet" href="cinemart.css">
</head>

<body>

    <header>

        <div class="logo">
            cinemart
        </div>

        <nav>
            <ul>
                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="cinemart.html">Filmes</a>
                </li>

                <li>
                    <a href="contato.html">Sobre</a>
                </li>
            </ul>
        </nav>

    </header>


    <section class="hero">

        <h1>Filmes</h1>

        <p>
            Descubra os melhores filmes do momento.
        </p>

        <button class="btn">
            Explorar
        </button>

    </section>


    <h2>
        Filmes em destaque
    </h2>


    <input
        type="text"
        placeholder="Pesquisar filmes..."
    >


    <div class="filmes" id="listaFilmes">


        <div class="filme" data-nome="Interestelar">

            <img
                src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"
                alt="Interestelar"
            >

            <div class="info">

                <h3>
                    Interestelar
                </h3>

                <p class="genero">
                    Ficção científica • 2014
                </p>

                <p class="nota">
                    ⭐ 8.7
                </p>

            </div>

        </div>


        <div class="filme" data-nome="Batman">

            <img
                src="https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg"
                alt="Batman"
            >

            <div class="info">

                <h3>
                    Batman
                </h3>

                <p class="genero">
                    Ação • 2022
                </p>

                <p class="nota">
                    ⭐ 7.8
                </p>

            </div>

        </div>


        <div class="filme" data-nome="Homem Aranha">

            <img
                src="https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg"
                alt="Homem-Aranha"
            >

            <div class="info">

                <h3>
                    Homem-Aranha
                </h3>

                <p class="genero">
                    Ação • Aventura
                </p>

                <p class="nota">
                    ⭐ 8.2
                </p>

            </div>

        </div>


    </div>

</body>

</html>
